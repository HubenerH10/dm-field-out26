<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E41E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DM Field">
<title>DM Field · Desafio Zero Out/26</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E41E2B; --ink:#222; --sub:#5F6670; --line:#DADDE2; --bg:#EEF0F3; --card:#fff;
  --seg:#2F6FD6; --ter:#23A55A; --qua:#E3B000; --qui:#8E44AD; --sex:#8B5A2B; --sem:#8A8F98;
  --tri:#0F6B35; --dup:#2E9E4F; --avu:#0F8B8D; --nao:#6B7280; --rev:#D98300; --off:#3F4650;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;display:flex;align-items:center;gap:12px}
header .t{flex:1;min-width:0}
header h1{font-family:var(--cond);font-size:22px;line-height:1;letter-spacing:.2px}
header small{display:block;font-size:13px;opacity:.9;margin-top:3px}
.devchip{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:12px 12px 24px}
.view.on{display:block}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day{flex:1 0 auto;min-width:52px;padding:9px 8px 8px;border-radius:10px;background:var(--card);border:2px solid transparent;font-weight:700;font-size:14px;text-align:center;position:relative}
.day i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 4px;background:var(--c)}
.day.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.day span{display:block;font-weight:500;font-size:11px;color:var(--sub)}

.search{display:flex;gap:8px;margin:10px 0 8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 12px;font-size:16px}
.sortbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-weight:600;font-size:14px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{flex:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{font-size:13px;color:var(--sub);margin:0 2px 8px}

.list{display:flex;flex-direction:column;gap:6px}
.cli{display:flex;align-items:stretch;background:var(--card);border-radius:10px;text-align:left;width:100%;overflow:hidden;border:1px solid var(--line)}
.cli .bar{width:6px;flex:none;background:var(--c)}
.cli .b{flex:1;min-width:0;padding:10px 10px 10px 12px}
.cli .n,.cli .m{display:block}
.cli .n{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cli .m{font-size:13px;color:var(--sub);margin-top:3px}
.cli .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;padding-right:10px;flex:none}
.dist{font-size:13px;font-weight:600;color:var(--sub)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff;background:var(--pc,#999);white-space:nowrap}
.pill.pend{background:transparent;color:var(--sub);border:1px solid var(--line)}
.more{margin:10px auto 0;display:block;padding:10px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600}
.empty{background:var(--card);border-radius:10px;padding:20px;text-align:center;color:var(--sub)}

nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 0 10px;font-weight:700;font-size:15px;color:var(--sub);border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--ink)}
nav .q{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--rev);color:#fff;font-size:12px;margin-left:6px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:16px 16px 0 0;max-height:92%;overflow-y:auto;z-index:21;transform:translateY(105%);transition:transform .22s ease;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 10px}
.sh-top{display:flex;gap:10px;align-items:flex-start}
.sh-top h2{flex:1;font-family:var(--cond);font-size:26px;line-height:1.05}
.x{font-size:26px;line-height:1;padding:2px 6px;color:var(--sub)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.meta span{font-size:13px;background:var(--bg);border-radius:6px;padding:4px 8px}
.meta .dtag{color:#fff;background:var(--c);font-weight:700}
.actions{display:flex;gap:8px;margin-bottom:10px}
.actions a,.actions button{flex:1;text-align:center;padding:11px 8px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.gps{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--bg);margin-bottom:12px}
.gps.bad{background:#FDECEC;color:#A3141E;font-weight:600}
.gps.ok{background:#E7F5EC;color:#14532D}
.hist{font-size:13px;color:var(--sub);margin:-4px 0 12px;line-height:1.5}
.hist b{color:var(--ink)}
.lbl{font-weight:700;font-size:15px;margin:14px 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);border-radius:12px;padding:12px 10px;text-align:left;background:#fff;min-height:60px}
.opt b{display:block;font-size:16px}
.opt small{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.25}
.opt.on{border-color:var(--oc);background:color-mix(in srgb,var(--oc) 10%,#fff)}
.opt.on b{color:var(--oc)}
.sub{display:none}
.sub.on{display:block}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;background:#fff}
.tog button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.hint{font-size:13px;color:var(--rev);margin-top:6px;font-weight:600}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:70px;font-size:16px;resize:vertical}
.go{width:100%;margin-top:16px;padding:15px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.go:disabled{opacity:.35}

/* parcial */
.hero{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line)}
.hero .k{font-size:14px;color:var(--sub);font-weight:600}
.big{font-family:var(--cond);font-size:56px;line-height:1;margin-top:4px}
.big small{font-size:22px;color:var(--sub);font-weight:600}
.track{height:12px;border-radius:6px;background:var(--bg);margin:12px 0 6px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--dup);border-radius:6px}
.hero p{font-size:14px;color:var(--sub);line-height:1.4;margin-top:6px}
.hero p b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--cond);font-size:30px;line-height:1}
.kpi span{display:block;font-size:13px;color:var(--sub);margin-top:4px;line-height:1.25}
h3{font-family:var(--cond);font-size:20px;margin:20px 2px 8px}
.dayrow{display:grid;grid-template-columns:48px 1fr 88px;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:10px;margin-bottom:6px;border:1px solid var(--line)}
.dayrow .d{font-weight:700;display:flex;align-items:center;gap:6px}
.dayrow .d i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.dayrow .track{margin:0;height:10px}
.dayrow .track i{background:var(--c)}
.dayrow .v{white-space:nowrap;text-align:right;font-size:13px;color:var(--sub)}
.dayrow .v b{color:var(--ink);font-size:15px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
.tblw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:9px 6px;white-space:nowrap;background:#F7F8FA}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:#F3F6FB;font-weight:700}
.sync{font-size:13px;color:var(--sub);margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}

/* dev picker + toast */
.picker{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 20px;max-width:640px;margin:0 auto}
.picker.on{display:flex}
.picker h2{font-family:var(--cond);font-size:30px}
.picker p{color:var(--sub);margin:6px 0 16px}
.picker .names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picker .names button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px 10px;font-weight:700;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;transition:.2s;z-index:40;max-width:92%;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>

};

const byCod = new Map(BASE.map(r=>[r[0],r]));
let dev = LS.get(K_DEV,null);
let fila = LS.get(K_FILA,[]);          // registros ainda não enviados
let remotos = LS.get(K_REM,[]);        // [data_hora, dev, cod, status]
let ultimaSync = LS.get(K_SYNC,null);
let pos = null;                        // {lat,lng}
let filtroDia = (()=>{const w=new Date().getDay();return w>=1&&w<=5?w-1:'all'})();
let filtroSit = 'avisitar';
let ordem = 'perto';
let limite = 60;

/* ---------- utilidades ---------- */
function distM(a,b,c,d){const R=6371000,t=Math.PI/180;const x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function fmtDist(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.',',')+' km'}
function fmtN(n){return n.toLocaleString('pt-BR')}
function pct(a,b){return b?Math.round(a/b*100):0}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dataBR(s){const d=new Date(s);if(isNaN(d))return s;return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
const NOMES_IDX = BASE.map(r=>norm(r[1]+' '+r[0]));

/* ---------- estado por cliente ---------- */
function todosRegistros(){
  return remotos.concat(fila.map(f=>[f.data_hora,f.desenvolvedor,f.cod_cliente,f.status]));
}
function estadoClientes(){
  const m = new Map();
  for(const r of todosRegistros()){
    const cod=Number(r[2]), s=ST[r[3]]; if(!s) continue;
    let e=m.get(cod); if(!e){e={best:null,dev:null,hist:[]};m.set(cod,e)}
    e.hist.push(r);
    if(!e.best || s.rank>ST[e.best].rank){e.best=r[3];e.dev=r[1]}
  }
  return m;
}
function sitDe(e){
  if(!e) return 'pend';
  const s=ST[e.best];
  if(s.rev) return 'rev';
  return 'feito';
}

/* ---------- tela Visitar ---------- */
function montaDias(){
  const est=estadoClientes();
  const cont={}; BASE.forEach(r=>{const sd=sitDe(est.get(r[0]));if(sd!=='feito'){cont[r[3]]=(cont[r[3]]||0)+1}});
  const btns = DIAS.map(d=>`<button class="day ${filtroDia===d.k?'on':''}" style="--c:${d.c}" data-d="${d.k}" role="tab" aria-selected="${filtroDia===d.k}"><i></i>${d.s}<span>${fmtN(cont[d.k]||0)}</span></button>`).join('')
    + `<button class="day ${filtroDia==='all'?'on':''}" style="--c:var(--ink)" data-d="all" role="tab"><i style="background:linear-gradient(90deg,var(--seg),var(--ter),var(--qua),var(--qui),var(--sex))"></i>Todos<span>${fmtN(Object.values(cont).reduce((a,b)=>a+b,0))}</span></button>`;
  $('#days').innerHTML=btns;
}
function montaChips(){
  const op=[['avisitar','A visitar'],['rev','Revisitar'],['feito','Concluídos'],['todos','Todos']];
  $('#chips').innerHTML=op.map(([k,t])=>`<button class="chip ${filtroSit===k?'on':''}" data-s="${k}">${t}</button>`).join('');
  $('#sort').textContent = ordem==='perto'?'Mais perto':'A–Z';
}
function renderLista(){
  montaDias(); montaChips();
  const est=estadoClientes();
  const q=norm($('#q').value.trim());
  let arr=[];
  for(let i=0;i<BASE.length;i++){
    const r=BASE[i];
    if(filtroDia!=='all' && r[3]!==filtroDia) continue;
    const e=est.get(r[0]), sd=sitDe(e);
    if(filtroSit==='avisitar' && sd==='feito') continue;
    if(filtroSit==='rev' && sd!=='rev') continue;
    if(filtroSit==='feito' && sd!=='feito') continue;
    if(q && !NOMES_IDX[i].includes(q)) continue;
    arr.push({r,e,d: pos?distM(pos.lat,pos.lng,r[8],r[9]):null});
  }
  if(ordem==='perto' && pos) arr.sort((a,b)=>a.d-b.d);
  $('#count').textContent = fmtN(arr.length)+(arr.length===1?' cliente':' clientes') + (ordem==='perto'&&!pos?' · libere a localização para ordenar por distância':'');
  if(!arr.length){
    $('#list').innerHTML=`<div class="empty">${filtroSit==='rev'?'Nenhum cliente para revisitar neste bloco.':q?'Nenhum cliente com esse nome ou código. Confira o bloco do dia ou use “Todos”.':'Tudo visitado neste bloco. Escolha outro dia acima.'}</div>`;
    return;
  }
  const html=arr.slice(0,limite).map(({r,e,d})=>{
    const st=e?ST[e.best]:null;
    const pill=st?`<span class="pill" style="--pc:${st.c}">${st.t}</span>`:`<span class="pill pend">Pendente</span>`;
    return `<button class="cli" style="--c:${DIA_COR[r[3]]}" data-cod="${r[0]}">
      <span class="bar"></span>
      <span class="b"><span class="n">${esc(r[1])}</span><span class="m">${r[0]} · ${esc(r[2].toLowerCase())} · ${esc(r[7])}</span></span>
      <span class="r">${d!=null?`<span class="dist">${fmtDist(d)}</span>`:''}${pill}</span>
    </button>`}).join('');
  $('#list').innerHTML = html + (arr.length>limite?`<button class="more" id="more">Mostrar mais ${Math.min(60,arr.length-limite)}</button>`:'');
}

/* ---------- ficha do cliente ---------- */
let form=null;
function abrirCliente(cod){
  const r=byCod.get(cod); if(!r) return;
  const e=estadoClientes().get(cod);
  form={cod, status:null, produtos:[], emb:null, motivo:null};
  const hist = e? e.hist.slice().sort((a,b)=>String(b[0]).localeCompare(String(a[0]))).slice(0,4).map(h=>`<b>${esc(ST[h[3]]?.t||h[3])}</b> por ${esc(h[1])} em ${dataBR(h[0])}`).join('<br>') : '';
  const opt=(k)=>`<button class="opt" data-st="${k}" style="--oc:${ST[k].c}"><b>${ST[k].t}</b><small>${ST[k].d}</small></button>`;
  $('#sheet').innerHTML=`
    <div class="grab"></div>
    <div class="sh-top"><h2 id="sh-name">${esc(r[1])}</h2><button class="x" id="fechar" aria-label="Fechar">×</button></div>
    <div class="meta">
      <span class="dtag" style="--c:${DIA_COR[r[3]]}">${DIA_NOME[r[3]]}</span>
      <span>Cód. ${r[0]}</span><span>${esc(r[2].toLowerCase())}</span><span>Rota ${esc(r[5])}</span>
      ${r[6]?`<span>CV ${esc(r[6])}</span>`:''}<span>${esc(r[7])}</span>
    </div>
    <div class="actions">
      <a href="https://www.google.com/maps/dir/?api=1&destination=${r[8]},${r[9]}" target="_blank" rel="noopener">Abrir rota no Maps</a>
      <button id="gpsbtn">Atualizar meu GPS</button>
    </div>
    <div class="gps" id="gpsinfo">Buscando sua localização…</div>
    ${hist?`<div class="hist">${hist}</div>`:''}
    <div class="lbl">Atendeu?</div>
    <div class="opts">${opt('TRIPLA')}${opt('DUPLA')}${opt('AVULSO')}${opt('NAO_VENDEU')}</div>
    <div class="lbl">Não conseguiu atender</div>
    <div class="opts">${opt('FECHADO')}${opt('AUSENTE')}${opt('FECHADO_PERM')}</div>

    <div class="sub" id="sub-prod"><div class="lbl">O que ele comprou?</div>
      <div class="tog" id="tg-prod">${PRODUTOS.map(p=>`<button data-p="${p}">${p}</button>`).join('')}</div>
      <div class="hint" id="prodhint" hidden></div></div>
    <div class="sub" id="sub-emb"><div class="lbl">Embalagem <small style="font-weight:500;color:var(--sub)">(opcional)</small></div>
      <div class="tog" id="tg-emb">${['SS','MS','SS e MS'].map(p=>`<button data-e="${p}">${p}</button>`).join('')}</div></div>
    <div class="sub" id="sub-mot"><div class="lbl">Por que não comprou?</div>
      <div class="tog" id="tg-mot">${MOTIVOS.map(p=>`<button data-m="${p}">${p}</button>`).join('')}</div></div>

    <div class="lbl">Observação <small style="font-weight:500;color:var(--sub)">(opcional)</small></div>
    <textarea id="obs" placeholder="Ex.: negociou GDM, troca de dono, abre só à tarde"></textarea>
    <button class="go" id="enviar" disabled>Registrar visita</button>`;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop=0;
  pegarGPS(true);
}
function fecharSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); form=null; }
function atualizaGpsInfo(){
  const el=$('#gpsinfo'); if(!el||!form) return;
  const r=byCod.get(form.cod);
  if(!pos){el.className='gps';el.textContent='Sem localização. Libere o GPS do navegador para registrar a distância.';return}
  const d=distM(pos.lat,pos.lng,r[8],r[9]); form.dist=Math.round(d);
  if(d>CONFIG.RAIO_M){el.className='gps bad';el.textContent=`Você está a ${fmtDist(d)} do cliente. A visita vai sair marcada como fora do raio.`}
  else {el.className='gps ok';el.textContent=`Você está a ${fmtDist(d)} do cliente.`}
}
function validaForm(){
  const b=$('#enviar'); if(!b||!form) return;
  let ok=!!form.status;
  const hint=$('#prodhint');
  if(form.status==='AVULSO'){
    const p=form.produtos;
    const ehDupla = p.length===2 && p.includes('Sprite Zero') && p.includes('Kuat Zero');
    if(hint){ hint.hidden=!(ehDupla||p.length===3); hint.textContent = p.length===3?'Os três produtos é Tripla. Marque Tripla lá em cima.':'Sprite Zero + Kuat Zero é Dupla. Marque Dupla lá em cima.'; }
    ok = p.length>=1 && p.length<=2 && !ehDupla;
  }
  if(form.status==='NAO_VENDEU') ok = ok && !!form.motivo;
  b.disabled=!ok;
}
function escolheStatus(k){
  form.status=k;
  document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.st===k));
  $('#sub-prod').classList.toggle('on',k==='AVULSO');
  $('#sub-emb').classList.toggle('on',['TRIPLA','DUPLA','AVULSO'].includes(k));
  $('#sub-mot').classList.toggle('on',k==='NAO_VENDEU');
  validaForm();
}
function registrar(){
  if(!form||!form.status) return;
  const r=byCod.get(form.cod);
  const prods = form.status==='TRIPLA'?PRODUTOS.slice():form.status==='DUPLA'?['Sprite Zero','Kuat Zero']:form.status==='AVULSO'?form.produtos:[];
  const reg={
    id:uid(), data_hora:new Date().toISOString(), desenvolvedor:dev,
    cod_cliente:r[0], cliente:r[1], segmento:r[2], dia_bloco:DIA_NOME[r[3]], dia_visita_original:r[4],
    rota:r[5], cidade:r[7], gc:r[10],
    status:form.status, status_desc:ST[form.status].t, produtos:prods.join(' + '),
    embalagem:form.emb||'', motivo:form.motivo||'', observacao:($('#obs').value||'').trim(),
    lat:pos?pos.lat:'', lng:pos?pos.lng:'', distancia_m:form.dist??'',
    fora_raio: form.dist!=null ? (form.dist>CONFIG.RAIO_M?'SIM':'NÃO') : 'SEM GPS',
    versao:CONFIG.VERSAO
  };
  fila.push(reg); LS.set(K_FILA,fila);
  fecharSheet(); renderLista();
  toast(ST[reg.status].rev ? 'Registrado. Cliente foi para Revisitar.' : 'Visita registrada.');
  enviarFila();
}

/* ---------- comunicação com a planilha ---------- */
let enviando=false;
async function enviarFila(){
  if(enviando||!fila.length||!/^https:/.test(CONFIG.GAS_URL)) {badge();return}
  enviando=true;
  for(const reg of fila.slice()){
    try{
      const res=await fetch(CONFIG.GAS_URL+'?payload='+encodeURIComponent(JSON.stringify(reg)),{method:'GET',cache:'no-store'});
      const j=await res.json();
      if(!j.ok) continue;
      if(!j.dup) remotos.push([reg.data_hora,reg.desenvolvedor,reg.cod_cliente,reg.status]);
      fila=fila.filter(f=>f.id!==reg.id); LS.set(K_FILA,fila); LS.set(K_REM,remotos);
    }catch(e){ break; /* sem sinal: tenta de novo depois */ }
  }
  enviando=false; badge();
  baixar(false); // a planilha confirma o que chegou
}
async function baixar(manual){
  if(!/^https:/.test(CONFIG.GAS_URL)){ if(manual) toast('Falta colar a URL do Apps Script no CONFIG.'); return }
  try{
    const res=await fetch(CONFIG.GAS_URL+'?action=dados&t='+Date.now(),{cache:'no-store'});
    const j=await res.json();
    if(j.ok){ remotos=j.rows; LS.set(K_REM,remotos); ultimaSync=new Date().toISOString(); LS.set(K_SYNC,ultimaSync);
      // a planilha é a referência: o que ela já recebeu sai da fila, mesmo que tenha sido apagado depois
      const rec=new Set((j.recebidos||[]).concat(j.ids||[])); if(rec.size){fila=fila.filter(f=>!rec.has(f.id));LS.set(K_FILA,fila)}
      if(manual) toast('Parcial atualizada.');
    }
  }catch(e){ if(manual) toast('Sem conexão. Mostrando o último dado salvo.') }
  renderLista(); if($('#v-parcial').classList.contains('on')) renderParcial(); badge();
}
function badge(){const b=$('#qbadge'); if(fila.length){b.hidden=false;b.textContent=fila.length}else b.hidden=true}

/* ---------- GPS ---------- */
function pegarGPS(soFicha){
  if(!navigator.geolocation){atualizaGpsInfo();return}
  navigator.geolocation.getCurrentPosition(p=>{
    pos={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};
    atualizaGpsInfo(); if(!soFicha) renderLista();
  },()=>{atualizaGpsInfo(); if(!soFicha) renderLista()},{enableHighAccuracy:true,timeout:12000,maximumAge:20000});
}

/* ---------- tela Parcial ---------- */
function renderParcial(){
  const est=estadoClientes();
  const base=BASE.length, meta=Math.ceil(base*CONFIG.META_PCT);
  let pos_=0,tri=0,atend=0,rev=0,perm=0,avu=0;
  const porDia={}; DIAS.concat([{k:-1}]).forEach(d=>porDia[d.k]={b:0,a:0,p:0});
  const porDev={}; CONFIG.DESENVOLVEDORES.forEach(n=>porDev[n]={reg:0,cli:new Set(),atend:0,pos:0,tri:0,fora:0});
  for(const r of BASE){
    const e=est.get(r[0]); const pd=porDia[r[3]]; pd.b++;
    if(!e) continue; const s=ST[e.best];
    if(s.atend){atend++;pd.a++} if(s.pos){pos_++;pd.p++} if(e.best==='TRIPLA')tri++; if(e.best==='AVULSO')avu++;
    if(s.rev)rev++; if(s.perm)perm++;
    const d=porDev[e.dev]||(porDev[e.dev]={reg:0,cli:new Set(),atend:0,pos:0,tri:0});
    if(s.atend)d.atend++; if(s.pos)d.pos++; if(e.best==='TRIPLA')d.tri++;
  }
  for(const r of todosRegistros()){const d=porDev[r[1]]||(porDev[r[1]]={reg:0,cli:new Set(),atend:0,pos:0,tri:0});d.reg++;d.cli.add(r[2])}
  const hoje=hojeISO(); const rest=CONFIG.DIAS_UTEIS.filter(d=>d>=hoje).length;
  const falta=Math.max(0,meta-pos_);
  const baseAj=base-perm;
  const devs=Object.entries(porDev).sort((a,b)=>b[1].pos-a[1].pos||b[1].atend-a[1].atend);
  $('#parcial').innerHTML=`
    <div class="hero">
      <div class="k">Positivados no time (Dupla ou Tripla)</div>
      <div class="big">${fmtN(pos_)} <small>de ${fmtN(meta)}</small></div>
      <div class="track"><i style="width:${Math.min(100,pct(pos_,meta))}%"></i></div>
      <p><b>${pct(pos_,base)}% da base</b> (gatilho ${Math.round(CONFIG.META_PCT*100)}%). ${falta?`Faltam <b>${fmtN(falta)}</b>${rest?`, cerca de <b>${fmtN(Math.ceil(falta/rest))} por dia útil</b> nos ${rest} dias que restam`:''}.`:'Meta coletiva batida.'}</p>
    </div>
    <div class="grid2">
      <div class="kpi"><b>${fmtN(atend)}</b><span>clientes atendidos (${pct(atend,base)}% da base)</span></div>
      <div class="kpi"><b>${pct(pos_,atend)}%</b><span>conversão nas visitas atendidas</span></div>
      <div class="kpi"><b>${fmtN(tri)}</b><span>Triplas (Plus)</span></div>
      <div class="kpi"><b>${fmtN(avu)}</b><span>vendas avulsas, sem combinada</span></div>
      <div class="kpi"><b>${fmtN(rev)}</b><span>para revisitar (fechado ou comprador ausente)</span></div>
      <div class="kpi"><b>${fmtN(perm)}</b><span>fecharam de vez. Sem eles, a base fica em ${fmtN(baseAj)} e o time está em ${pct(pos_,baseAj)}%</span></div>
    </div>
    <h3>Cobertura por bloco</h3>
    ${DIAS.concat(porDia[-1].b?[{k:-1,s:'S/d'}]:[]).map(d=>{const v=porDia[d.k];return `<div class="dayrow" style="--c:${DIA_COR[d.k]}"><span class="d"><i></i>${d.s}</span><span class="track"><i style="width:${pct(v.a,v.b)}%"></i></span><span class="v"><b>${pct(v.a,v.b)}%</b> de ${fmtN(v.b)}</span></div>`}).join('')}
    <h3>Por desenvolvedor</h3>
    <div class="tblw"><table class="tbl">
      <thead><tr><th>Nome</th><th>Visitas</th><th>Atend.</th><th>Posit.</th><th>Conv.</th><th>Tripla</th></tr></thead>
      <tbody>${devs.map(([n,v])=>`<tr class="${n===dev?'me':''}"><td>${esc(n)}</td><td>${fmtN(v.reg)}</td><td>${fmtN(v.atend)}</td><td>${fmtN(v.pos)}</td><td>${pct(v.pos,v.atend)}%</td><td>${fmtN(v.tri)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="sync"><span>${fila.length?`${fila.length} visita(s) aguardando sinal para enviar. `:''}${ultimaSync?'Atualizado em '+dataBR(ultimaSync):'Ainda não sincronizou'}</span><button id="sincr">Atualizar</button></div>`;
}

/* ---------- eventos ---------- */
function escolherDev(){ $('#names').innerHTML=CONFIG.DESENVOLVEDORES.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join(''); $('#picker').classList.add('on') }
$('#names').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;dev=b.dataset.n;LS.set(K_DEV,dev);$('#devchip').textContent=dev;$('#picker').classList.remove('on');renderLista()});
$('#devchip').addEventListener('click',escolherDev);
$('#days').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b)return;filtroDia=b.dataset.d==='all'?'all':+b.dataset.d;limite=60;renderLista();$('#main').scrollTop=0});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filtroSit=b.dataset.s;limite=60;renderLista()});
$('#sort').addEventListener('click',()=>{ordem=ordem==='perto'?'az':'perto';if(ordem==='perto')pegarGPS(false);renderLista()});
let qt; $('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{limite=60;renderLista()},150)});
$('#list').addEventListener('click',e=>{ if(e.target.id==='more'){limite+=60;renderLista();return} const b=e.target.closest('.cli'); if(b) abrirCliente(+b.dataset.cod)});
$('#scrim').addEventListener('click',fecharSheet);
$('#sheet').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#fechar')) return fecharSheet();
  if(t.closest('#gpsbtn')) { $('#gpsinfo').textContent='Buscando sua localização…'; return pegarGPS(true) }
  const o=t.closest('.opt'); if(o) return escolheStatus(o.dataset.st);
  const p=t.closest('[data-p]'); if(p){const v=p.dataset.p;const i=form.produtos.indexOf(v);i<0?form.produtos.push(v):form.produtos.splice(i,1);p.classList.toggle('on');return validaForm()}
  const em=t.closest('[data-e]'); if(em){form.emb=form.emb===em.dataset.e?null:em.dataset.e;document.querySelectorAll('#tg-emb button').forEach(x=>x.classList.toggle('on',x.dataset.e===form.emb));return}
  const m=t.closest('[data-m]'); if(m){form.motivo=m.dataset.m;document.querySelectorAll('#tg-mot button').forEach(x=>x.classList.toggle('on',x===m));return validaForm()}
  if(t.closest('#enviar')) registrar();
});
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  $('#main').scrollTop=0;
  if(b.dataset.v==='parcial'){renderParcial();baixar(false)}
});
$('#parcial').addEventListener('click',e=>{if(e.target.id==='sincr')baixar(true)});
window.addEventListener('online',()=>{enviarFila().then(()=>baixar(false))});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){enviarFila();baixar(false)}});

/* ---------- início ---------- */
if(!dev||!CONFIG.DESENVOLVEDORES.includes(dev)) escolherDev(); else $('#devchip').textContent=dev;
renderLista(); badge(); pegarGPS(false); enviarFila().then(()=>baixar(false));
setInterval(()=>{enviarFila()},60000);
